name: Apropos
options:
  bundleIdPrefix: com.thyfriendlyfox
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Apropos:
    type: application
    platform: iOS
    sources:
      - path: Apropos
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thyfriendlyfox.apropos
        PRODUCT_NAME: Apropos
        INFOPLIST_FILE: Apropos/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        # Simulator only. Device builds sign with the profile Xcode makes.
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO

  AproposTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AproposTests
    dependencies:
      - target: Apropos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thyfriendlyfox.apropos.tests
        GENERATE_INFOPLIST_FILE: YES

  AproposUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AproposUITests
    dependencies:
      - target: Apropos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thyfriendlyfox.apropos.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Apropos

schemes:
  Apropos:
    build:
      targets:
        Apropos: all
        AproposTests: [test]
        AproposUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AproposTests
        - AproposUITests
